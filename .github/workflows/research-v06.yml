name: V0.6 CPU research and publication gates
on:
  pull_request:
  push:
    branches: [main, 'feat/mrna-v06-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-cpu:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[research-v06]'
      - name: All original and V0.6 tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic schema to prediction replay, no GPU or private data
        run: |
          python -m tools.mrna_design e2e --out runs/ci-v06-e2e
          python -m tools.mrna_design e2e --out runs/ci-v06-e2e/import --verify-only
          python -m tools.mrna_design e2e --out runs/ci-v06-e2e/split --verify-only
          python -m tools.mrna_design e2e --out runs/ci-v06-e2e/baseline --verify-only
      - name: Historical protection, publication rights and public-site replay
        run: |
          python -m tools.mrna_design.verify_release --base 27220368a186f2c4568fede27db963f23b4302dd
          python -m tools.mrna_design.export_site --verify
          python tools/prepare_public.py --out runs/ci-public-candidate
      - name: Figure metadata and blocked-data contracts
        run: |
          python -m tools.mrna_design.export_figures --spec paper/figure_specs/fig1 --out runs/ci-fig1
          python -m tools.mrna_design.export_figures --spec paper/figure_specs/fig3 --out runs/ci-fig3
