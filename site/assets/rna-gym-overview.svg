<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="344" viewBox="0 0 1120 344" role="img" aria-labelledby="title description">
  <title id="title">RNA-Gym — From RNA data to biological understanding</title>
  <desc id="description">An RNA stem-loop connects source evidence to reproducible evaluation. RNA-Gym is an open research platform under active scientific audit.</desc>
  <rect width="1120" height="344" rx="20" fill="#12364f"/>
  <path d="M800 0H1100Q1120 0 1120 20V324Q1120 344 1100 344H800Z" fill="#19465e"/>
