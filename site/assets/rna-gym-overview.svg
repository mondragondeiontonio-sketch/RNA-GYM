    <text x="48" y="49">OPEN RNA RESEARCH INFRASTRUCTURE</text>
  </g>
  <text x="46" y="129" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700" letter-spacing="-2">RNA-Gym</text>
  <text x="49" y="174" fill="#e2f0f4" font-family="Arial,Helvetica,sans-serif" font-size="24">From RNA data to biological understanding.</text>
  <text x="49" y="206" fill="#a9c7d4" font-family="Arial,Helvetica,sans-serif" font-size="16">Traceable assays. Reproducible evaluation. Better models.</text>
