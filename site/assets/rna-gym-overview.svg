<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title description">
  <title id="title">RNA-Gym — Traceable RNA data, reproducible model evaluation</title>
  <desc id="description">A folded RNA strand becomes an embedding grid. The native Python interface connects datasets, GPU encoding and controlled evaluation. Research infrastructure; no admitted assay scores are claimed.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1120" height="380" rx="18" fill="#163e5c"/>
  <rect x="714" width="406" height="380" fill="url(#grid)"/>
  <path d="M714 28V352" stroke="#3c627c"/>
  <rect x="52" y="46" width="26" height="4" rx="2" fill="#f6c375"/>
  <text x="91" y="52" fill="#c7dce9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">RNA FOUNDATION MODEL EVALUATION</text>
  <text x="48" y="163" fill="#f6fafe" font-family="Arial,Helvetica,sans-serif" font-size="90" font-weight="700" letter-spacing="-3">RNA-Gym</text>
  <text x="53" y="212" fill="#f6fafe" font-family="Arial,Helvetica,sans-serif" font-size="24">From RNA to reproducible evaluation.</text>
  <text x="53" y="247" fill="#b6cedd" font-family="Arial,Helvetica,sans-serif" font-size="16">Traceable datasets. Local GPU models. Comparable protocols.</text>
  <path d="M53 280H652" stroke="#3c627c"/>
  <g font-family="monospace" font-size="16">
    <text x="53" y="320" fill="#6dd3dc">DatasetHub</text>
    <text x="199" y="320" fill="#6e91a9">/</text>
    <text x="226" y="320" fill="#f6fafe">model.encode</text>
    <text x="399" y="320" fill="#6e91a9">/</text>
    <text x="426" y="320" fill="#f6c375">RNABenchmark</text>
  </g>
  <text x="53" y="351" fill="#91b3c9" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="1.5">DATA IDENTITY FIRST. SCORES ONLY WHEN EVIDENCE IS READY.</text>
